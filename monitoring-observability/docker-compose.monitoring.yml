version: '3.8'

networks:
  monitoring_network:
    name: ahmad-enterprise-monitoring-net
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

services:
  # ---------------------------------------------------------------------------
  # A) Prometheus Service: Time-Series Metrics Collector Engine
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: ahmad-enterprise-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    extra_hosts:
      - "host.docker.internal:host-gateway" # Resolves localhost from container to host machine
    networks:
      - monitoring_network

  # ---------------------------------------------------------------------------
  # B) Grafana Enterprise Service: High-Availability Telemetry Visualizer
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.0.0
    container_name: ahmad-enterprise-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=SuperSecureGrafana2026
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_network
