name: Enterprise Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  production-deployment:
    name: Code Scan, Build & Deploy to AWS Fargate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: |
          pip install flake8
          flake8 backend-api/main.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR Vault
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Hardened Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ahmad-enterprise-api
          IMAGE_TAG: latest
        run: |
          cd backend-api
          docker build --provenance=false -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Download Active Task Definition Spec
        run: |
          aws ecs describe-task-definition --task-definition ahmad-enterprise-task --query taskDefinition > task-definition.json

      - name: Inject New Image URI into Task Spec
        id: render-app-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ahmad-enterprise-api
          image: ${{ steps.login-ecr.outputs.registry }}/ahmad-enterprise-api:latest

      - name: Deploy Rebuilt Architecture to AWS ECS Fargate Cluster 🔥
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-app-container.outputs.task-definition }}
          service: ahmad-enterprise-service
          cluster: ahmad-enterprise-cluster
          wait-for-service-stability: true
